{% extends 'base.html' %}{% block content %}<div class="page-head"><h1>Products</h1></div><form class="panel" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="form-grid"><div><label>Name</label><input name="name" required></div><div><label>SKU</label><input name="sku"></div><div><label>Price (₹)</label><input type="number" min="0" step=".01" name="price" required></div><div><label>Stock</label><input type="number" min="0" name="stock" value="0" required></div></div><button class="btn primary">Add product</button></form><section class="panel"><h2>Catalog</h2><div class="table-wrap"><table><tr><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th><th></th></tr>{% for p in products %}<tr><td>{{ p.name }}</td><td>{{ p.sku }}</td><td>₹{{ p.price|rupees }}</td><td>{{ p.stock }}</td><td>{% if is_admin %}<form method="post" action="{{ url_for('delete_product', product_id=p.id) }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn light small">Archive</button></form>{% endif %}</td></tr>{% endfor %}</table></div></section>{% endblock %}
