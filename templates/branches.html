{% extends 'base.html' %}{% block content %}<h1>Branch management</h1><form class="panel" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Branch name</label><input name="name" required maxlength="120"><button class="btn primary">Create branch</button></form><section class="panel"><a href="{{ url_for('staff') }}">Assign staff</a><table><tr><th>Branch</th><th>Assigned users</th><th>New linked bills</th></tr>{% for b,c,n in rows %}<tr><td>{{ b.name }}</td><td>{{ c }}</td><td>{{ n }}</td></tr>{% endfor %}</table><p>Historical bills are not reassigned. Branches are reporting labels, not access boundaries.</p></section>{% endblock %}
