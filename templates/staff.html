{% extends 'base.html' %}{% block content %}<h1>Staff management</h1><form class="panel" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="form-grid"><div><label>Username</label><input name="username" required minlength="3"></div><div><label>Temporary password (12+ characters)</label><input type="password" name="password" minlength="12" required></div></div><label>Branch (create first)</label><select name="branch_id" required><option value="">Select branch</option>{% for b in branches %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}</select><button class="btn primary">Create staff account</button></form><section class="panel"><table><tr><th>Username</th><th>Role</th><th>Active</th><th></th></tr>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.role }}</td><td>{{ u.active }}<form method="post" action="{{ url_for('assign_branch',uid=u.id) }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><select name="branch_id" required><option value="">Unassigned / select</option>{% for b in branches %}<option value="{{ b.id }}" {% if assignments.get(u.id)==b.id %}selected{% endif %}>{{ b.name }}</option>{% endfor %}</select><button>Assign</button></form></td><td>{% if u.role != 'admin' %}<form method="post" action="{{ url_for('toggle_staff', user_id=u.id) }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn light small">{{ 'Disable' if u.active else 'Enable' }}</button></form>{% endif %}</td></tr>{% endfor %}</table></section>{% endblock %}
