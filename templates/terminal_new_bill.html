{% extends 'base.html' %}{% block content %}
<div class="page-head"><div><div class="eyebrow">OWL STORE · PAY TERMINAL</div><h1>Quick bill</h1></div><a class="btn light" href="{{ url_for('terminal_dashboard') }}">Back</a></div>
<form class="panel" method="post" action="{{ url_for('terminal_create_bill') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="form-grid"><div><label>Customer name</label><input name="customer" maxlength="150" required></div><div><label>Customer phone (10 digits)</label><input name="phone" pattern="[0-9]{10}" inputmode="numeric" required></div></div>
<h2>Items</h2><div id="terminal-items"><div class="bill-item"><select name="product_id[]" required>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.price }}">{{ p.name }} — ₹{{ p.price|rupees }}</option>{% endfor %}</select><input class="qty" name="qty[]" type="number" min="1" max="10000" value="1" required><button class="icon-btn remove" type="button">×</button></div></div>
<button class="btn light small" type="button" id="add-item" {% if not products %}disabled{% endif %}>+ Add item</button><div class="form-grid compact"><div><label>Discount (₹)</label><input id="terminal-discount" name="discount" type="number" min="0" step="0.01" value="0"></div></div><div class="total-preview"><span>Estimated total</span><strong id="terminal-total">₹0.00</strong></div><button class="btn primary" {% if not products %}disabled{% endif %}>Create bill &amp; monitor payment</button><p class="muted tiny">Terminal quick billing uses product prices and zero tax. Use the standard New Bill screen for EMI or tax-specific billing.</p></form>
<script>const list=document.getElementById('terminal-items');function total(){let sum=0;list.querySelectorAll('.bill-item').forEach(r=>sum+=Number(r.querySelector('select').selectedOptions[0]?.dataset.price||0)*Number(r.querySelector('.qty').value||0));document.getElementById('terminal-total').textContent='₹'+Math.max(0,sum-Number(document.getElementById('terminal-discount').value||0)).toFixed(2)}function bind(r){r.querySelectorAll('select,input').forEach(e=>e.addEventListener('input',total));r.querySelector('.remove').addEventListener('click',()=>{if(list.children.length>1)r.remove();total()})}list.querySelectorAll('.bill-item').forEach(bind);document.getElementById('add-item').addEventListener('click',()=>{let r=list.firstElementChild.cloneNode(true);r.querySelector('.qty').value='1';list.appendChild(r);bind(r);total()});document.getElementById('terminal-discount').addEventListener('input',total);total();</script>
{% endblock %}
